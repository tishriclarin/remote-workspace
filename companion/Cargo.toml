[package]
name = "sshworkspace"
version = "0.7.0"
edition = "2021"
description = "Local-first SSH Workspace native MCP companion"
license = "MIT"
repository = "https://github.com/tishriclarin/ssh-workspace"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

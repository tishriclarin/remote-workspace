name: Python SSH Workspace tests
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q launch.py server.py vault.py vault_admin.py ssh_clients.py activity.py enroll.py local_paths.py settings_ui.py package_plugin.py tests
      - name: Run SSH and vault regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build plugin ZIP and validate archive contents
        run: |
          python package_plugin.py --output "${RUNNER_TEMP}/ssh-workspace-test.zip"
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          path = Path(__import__("os").environ["RUNNER_TEMP"]) / "ssh-workspace-test.zip"
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              assert bad is None, f"corrupt archive member: {bad}"
              members = set(archive.namelist())
              required = {"plugin.json", "mcp.json", "launch.py", "server.py", "vault.py", "README.md"}
              assert required <= members, f"missing plugin members: {required - members}"
              manifest = json.loads(archive.read("plugin.json"))
              assert manifest["name"] == "ssh-workspace"
              assert all(not name.startswith("/") and ".." not in Path(name).parts for name in members)
          PY

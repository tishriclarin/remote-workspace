name: Native SSH Companion
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-build.yml'
  pull_request:
    paths:
      - 'companion/**'
      - '.github/workflows/companion-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Unit tests
        run: cargo test --verbose
      - name: Compile bundled SSH companion
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage deliverable
        shell: bash
        run: |
          mkdir -p dist/installer dist/browser/chromium
          cp README.md dist/README.md
          cp ../installer/setup.html ../installer/setup.js dist/installer/
          cp ../browser/chromium/manifest.json ../browser/chromium/popup.html ../browser/chromium/popup.js ../browser/chromium/README.md dist/browser/chromium/
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/sshworkspace${EXT}" "dist/sshworkspace${EXT}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "sshworkspace${EXT}" > SHA256SUMS; else shasum -a 256 "sshworkspace${EXT}" > SHA256SUMS; fi
      - name: Upload unsigned build for review
        uses: actions/upload-artifact@v4
        with:
          name: sshworkspace-0.6.0-${{ matrix.target }}
          path: companion/dist/
          if-no-files-found: error

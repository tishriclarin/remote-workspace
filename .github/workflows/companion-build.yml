name: Native SSH Companion
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'scripts/**'
      - '.github/workflows/companion-build.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'scripts/**'
      - '.github/workflows/companion-build.yml'
  workflow_dispatch:
concurrency:
  group: native-ssh-companion-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Unit tests
        run: cargo test --verbose
      - name: Compile bundled SSH companion
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage deliverable
        shell: bash
        run: |
          mkdir -p dist/installer dist/browser/chromium
          cp README.md dist/README.md
          cp ../installer/setup.html ../installer/setup.js dist/installer/
          cp ../browser/chromium/manifest.json ../browser/chromium/popup.html ../browser/chromium/popup.js ../browser/chromium/README.md dist/browser/chromium/
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/remoteworkspace${EXT}" "dist/remoteworkspace${EXT}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "remoteworkspace${EXT}" > SHA256SUMS; else shasum -a 256 "remoteworkspace${EXT}" > SHA256SUMS; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate packaging inputs
        run: python ../scripts/tests/test_build_desktop_plugin.py
      - name: Smoke test running MCP server
        env:
          REMOTEWORKSPACE_BIN: ${{ github.workspace }}/companion/target/${{ matrix.target }}/release/remoteworkspace${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python ../scripts/tests/test_mcp_runtime.py
      - name: Test real SSH key pinning against disposable local sshd
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          REMOTEWORKSPACE_BIN: ${{ github.workspace }}/companion/target/${{ matrix.target }}/release/remoteworkspace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          python ../scripts/tests/test_live_ssh.py
      - name: Package platform-specific desktop plugin
        run: python ../scripts/build_desktop_plugin.py --binary target/${{ matrix.target }}/release/remoteworkspace${{ runner.os == 'Windows' && '.exe' || '' }} --target ${{ matrix.target }} --version 0.7.0 --output dist
      - name: Validate packaged native MCP execution
        env:
          REMOTEWORKSPACE_ARCHIVES: dist
        run: python ../scripts/tests/test_archive_runtime.py
      - name: Upload unsigned build for review
        uses: actions/upload-artifact@v4
        with:
          name: remoteworkspace-0.7.0-${{ matrix.target }}
          path: companion/dist/
          if-no-files-found: error

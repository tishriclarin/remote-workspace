name: Android ARM64 Companion
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/android-build.yml'
      - 'scripts/test-termux-android.sh'
      - 'AGENTS.md'
      - 'skills/**'
  pull_request:
    paths:
      - 'companion/**'
      - '.github/workflows/android-build.yml'
      - 'scripts/test-termux-android.sh'
      - 'AGENTS.md'
      - 'skills/**'
  workflow_dispatch:
concurrency:
  group: android-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cross-build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y perl make cmake pkg-config
          cargo install cargo-ndk --locked
      - name: Validate Termux smoke-test script on Linux runner
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/test-termux-android.sh
          set +e
          output=$(bash scripts/test-termux-android.sh /nonexistent/remoteworkspace 2>&1)
          status=$?
          set -e
          if [[ "$status" -ne 2 ]] || [[ "$output" != *'Android ARM64 device required'* ]]; then
            printf 'Expected unsupported-host exit 2, got %s: %s\n' "$status" "$output" >&2
            exit 1
          fi
      - name: Reject unsupported Android SDK levels before running binaries
        shell: bash
        run: |
          set -euo pipefail
          mock_dir=$(mktemp -d)
          trap 'rm -rf -- "$mock_dir"' EXIT
          printf '#!/bin/sh\nprintf "aarch64\\n"\n' > "$mock_dir/uname"
          printf '%s\n' '#!/bin/sh' 'printf "%s\\n" "$TEST_SDK"' > "$mock_dir/getprop"
          chmod 755 "$mock_dir/uname" "$mock_dir/getprop"
          for sdk in 27 invalid; do
            set +e
            output=$(PATH="$mock_dir:$PATH" TEST_SDK="$sdk" bash scripts/test-termux-android.sh /nonexistent/remoteworkspace 2>&1)
            status=$?
            set -e
            if [[ "$status" -ne 2 ]]; then
              printf 'SDK %s: expected rejection exit 2, got %s: %s\\n' "$sdk" "$status" "$output" >&2
              exit 1
            fi
            if [[ "$sdk" == 27 && "$output" != *'Android API level 28 or newer required'* ]] ||
               [[ "$sdk" == invalid && "$output" != *'Android SDK property invalid'* ]]; then
              printf 'SDK %s: unexpected rejection: %s\\n' "$sdk" "$output" >&2
              exit 1
            fi
          done
      - name: Accept Android API 28 boundary before companion invocation
        shell: bash
        run: |
          set -euo pipefail
          mock_dir=$(mktemp -d)
          trap 'rm -rf -- "$mock_dir"' EXIT
          printf '#!/bin/sh\nprintf "aarch64\\n"\n' > "$mock_dir/uname"
          printf '#!/bin/sh\nprintf "28\\n"\n' > "$mock_dir/getprop"
          # Distinct exit code proves the SDK guard allowed execution.
          printf '#!/bin/sh\n[ "$1" = doctor ] && exit 73\nexit 99\n' > "$mock_dir/companion"
          chmod 755 "$mock_dir/uname" "$mock_dir/getprop" "$mock_dir/companion"
          set +e
          PATH="$mock_dir:$PATH" bash scripts/test-termux-android.sh "$mock_dir/companion"
          status=$?
          set -e
          if [[ "$status" -ne 73 ]]; then
            printf 'Expected API 28 to invoke companion doctor (exit 73), got %s\\n' "$status" >&2
            exit 1
          fi
      - name: Regression test formatted unsafe MCP tool listing
        shell: bash
        run: |
          set -euo pipefail
          # Keep the smoke-test rejection guard sensitive to pretty-printed JSON.
          for unsafe_tool in execute_command run_shell; do
            fixture="{\"tools\":[{\"name\" : \"$unsafe_tool\"}]}"
            if ! grep -Eq '"name"[[:space:]]*:[[:space:]]*"(execute_command|run_shell)"' <<< "$fixture"; then
              echo "ERROR: formatted unsafe MCP tool $unsafe_tool escaped detection" >&2
              exit 1
            fi
          done
      - name: Exercise MCP smoke-test rejection with mocked Android companion
        shell: bash
        run: |
          set -euo pipefail
          mock_dir=$(mktemp -d)
          trap 'rm -rf -- "$mock_dir"' EXIT
          printf '#!/bin/sh\nprintf "aarch64\\n"\n' > "$mock_dir/uname"
          printf '#!/bin/sh\nprintf "28\\n"\n' > "$mock_dir/getprop"
          cat > "$mock_dir/companion" <<'MOCK'
          #!/bin/sh
          if [ "$1" = doctor ]; then exit 0; fi
          if [ "$1" != mcp ]; then exit 99; fi
          cat >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-03-26"}}' '{"jsonrpc":"2.0","id":2,"result":{"tools":[{"name" : "run_shell"}]}}' '{"jsonrpc":"2.0","id":3,"result":{"content":[{"type":"text","text":"Unknown or unauthorized tool"}],"isError":true}}'
          MOCK
          chmod 755 "$mock_dir/uname" "$mock_dir/getprop" "$mock_dir/companion"
          set +e
          output=$(PATH="$mock_dir:$PATH" TMPDIR="$mock_dir" bash scripts/test-termux-android.sh "$mock_dir/companion" 2>&1)
          status=$?
          set -e
          if [[ "$status" -ne 1 || "$output" != *'unsafe command tool exposed'* ]]; then
            printf 'Expected unsafe MCP listing rejection (exit 1), got %s: %s\n' "$status" "$output" >&2
            exit 1
          fi
      - name: Exercise successful read-only MCP smoke test with mocked Android companion
        shell: bash
        run: |
          set -euo pipefail
          mock_dir=$(mktemp -d)
          trap 'rm -rf -- "$mock_dir"' EXIT
          printf '#!/bin/sh\nprintf "aarch64\n"\n' > "$mock_dir/uname"
          printf '#!/bin/sh\nprintf "28\n"\n' > "$mock_dir/getprop"
          cat > "$mock_dir/companion" <<'MOCK'
          #!/bin/sh
          if [ "$1" = doctor ]; then exit 0; fi
          if [ "$1" != mcp ]; then exit 99; fi
          cat >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-03-26"}}' '{"jsonrpc":"2.0","id":2,"result":{"tools":[{"name":"list_hosts"}]}}' '{"jsonrpc":"2.0","id":3,"result":{"content":[{"type":"text","text":"Unknown or unauthorized tool"}],"isError":true}}'
          MOCK
          chmod 755 "$mock_dir/uname" "$mock_dir/getprop" "$mock_dir/companion"
          output=$(PATH="$mock_dir:$PATH" TMPDIR="$mock_dir" bash scripts/test-termux-android.sh "$mock_dir/companion")
          if [[ "$output" != *'PASS: prebuilt Android binary initialized MCP and rejected unsafe write'* ]]; then
            printf 'Expected successful MCP smoke test, got: %s\n' "$output" >&2
            exit 1
          fi
      - name: Reject unrelated MCP errors masquerading as unsafe-tool rejection
        shell: bash
        run: |
          set -euo pipefail
          mock_dir=$(mktemp -d)
          trap 'rm -rf -- "$mock_dir"' EXIT
          printf '#!/bin/sh\nprintf "aarch64\n"\n' > "$mock_dir/uname"
          printf '#!/bin/sh\nprintf "28\n"\n' > "$mock_dir/getprop"
          cat > "$mock_dir/companion" <<'MOCK'
          #!/bin/sh
          if [ "$1" = doctor ]; then exit 0; fi
          if [ "$1" != mcp ]; then exit 99; fi
          cat >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-03-26"}}' '{"jsonrpc":"2.0","id":2,"result":{"tools":[{"name":"list_hosts"}]}}' '{"jsonrpc":"2.0","id":3,"result":{}}' '{"jsonrpc":"2.0","id":4,"result":{"isError":true}}'
          MOCK
          chmod 755 "$mock_dir/uname" "$mock_dir/getprop" "$mock_dir/companion"
          set +e
          output=$(PATH="$mock_dir:$PATH" TMPDIR="$mock_dir" bash scripts/test-termux-android.sh "$mock_dir/companion" 2>&1)
          status=$?
          set -e
          if [[ "$status" -ne 1 || "$output" != *'unsafe tool was not rejected'* ]]; then
            printf 'Expected mismatched MCP error rejection (exit 1), got %s: %s\n' "$status" "$output" >&2
            exit 1
          fi
      - name: Reject initialization fields from unrelated MCP response IDs
        shell: bash
        run: |
          set -euo pipefail
          mock_dir=$(mktemp -d)
          trap 'rm -rf -- "$mock_dir"' EXIT
          printf '#!/bin/sh\nprintf "aarch64\\n"\n' > "$mock_dir/uname"
          printf '#!/bin/sh\nprintf "28\\n"\n' > "$mock_dir/getprop"
          cat > "$mock_dir/companion" <<'MOCK'
          #!/bin/sh
          if [ "$1" = doctor ]; then exit 0; fi
          if [ "$1" != mcp ]; then exit 99; fi
          cat >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"result":{}}' '{"jsonrpc":"2.0","id":2,"result":{"tools":[{"name":"list_hosts"}]}}' '{"jsonrpc":"2.0","id":4,"result":{"protocolVersion":"2025-03-26"}}' '{"jsonrpc":"2.0","id":3,"result":{"isError":true}}'
          MOCK
          chmod 755 "$mock_dir/uname" "$mock_dir/getprop" "$mock_dir/companion"
          set +e
          output=$(PATH="$mock_dir:$PATH" TMPDIR="$mock_dir" bash scripts/test-termux-android.sh "$mock_dir/companion" 2>&1)
          status=$?
          set -e
          if [[ "$status" -ne 1 || "$output" != *'MCP initialization response missing'* ]]; then
            printf 'Expected mismatched initialization ID rejection (exit 1), got %s: %s\n' "$status" "$output" >&2
            exit 1
          fi
      - name: Reject tools/list fields from unrelated MCP response IDs
        shell: bash
        run: |
          set -euo pipefail
          mock_dir=$(mktemp -d)
          trap 'rm -rf -- "$mock_dir"' EXIT
          printf '#!/bin/sh\nprintf "aarch64\n"\n' > "$mock_dir/uname"
          printf '#!/bin/sh\nprintf "28\n"\n' > "$mock_dir/getprop"
          cat > "$mock_dir/companion" <<'MOCK'
          #!/bin/sh
          if [ "$1" = doctor ]; then exit 0; fi
          if [ "$1" != mcp ]; then exit 99; fi
          cat >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-03-26"}}' '{"jsonrpc":"2.0","id":2,"result":{}}' '{"jsonrpc":"2.0","id":4,"result":{"tools":[{"name":"list_hosts"}]}}' '{"jsonrpc":"2.0","id":3,"result":{"isError":true}}'
          MOCK
          chmod 755 "$mock_dir/uname" "$mock_dir/getprop" "$mock_dir/companion"
          set +e
          output=$(PATH="$mock_dir:$PATH" TMPDIR="$mock_dir" bash scripts/test-termux-android.sh "$mock_dir/companion" 2>&1)
          status=$?
          set -e
          if [[ "$status" -ne 1 || "$output" != *'MCP tool listing missing'* ]]; then
            printf 'Expected mismatched tools/list ID rejection (exit 1), got %s: %s\n' "$status" "$output" >&2
            exit 1
          fi
      - name: Test native Rust code on Linux host
        working-directory: companion
        run: cargo test
      - name: Cross-compile Android ARM64
        working-directory: companion
        env:
          OPENSSL_STATIC: '1'
          CARGO_NDK_PLATFORM: '28'
        run: cargo ndk -t arm64-v8a build --release
      - name: Verify Android ELF target and dynamic linker
        shell: bash
        run: |
          set -euo pipefail
          BIN=companion/target/aarch64-linux-android/release/remoteworkspace
          test -s "$BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -Eq 'Class:.*ELF64'
          readelf -h "$BIN" | grep -Eq 'Machine:.*AArch64'
          # Dynamic Android executables must request Android's linker, not glibc's.
          if readelf -l "$BIN" | grep -q 'Requesting program interpreter'; then
            readelf -l "$BIN" | grep -F '/system/bin/linker64'
          fi
          if readelf -d "$BIN" | grep -Eq 'NEEDED.*(libc\.so\.6|libpthread\.so\.0|libdl\.so\.2)'; then
            echo 'ERROR: Linux glibc dependency detected in Android executable' >&2
            exit 1
          fi
      - name: Package Android executable and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp companion/target/aarch64-linux-android/release/remoteworkspace dist/remoteworkspace
          chmod 755 dist/remoteworkspace
          (cd dist && sha256sum remoteworkspace > SHA256SUMS)
          printf '%s\n' 'Android ARM64 (aarch64-linux-android) executable.' 'Development artifact; not an APK or installed ChatGPT plugin.' 'Use on Android only after explicit user approval.' > dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remote-workspace-android-arm64
          path: dist/
          if-no-files-found: error
